<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Magnum Multi-Draw Example</title>
  <link rel="stylesheet" href="m-dark.compiled.css" />
  <link rel="stylesheet" href="WebApplication.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    #overlay {
      position: absolute;
      white-space: pre-wrap;
      left: 1rem;
      top: 1rem;
      color: #e6e6e6; /*var(--code-color)*/
    }
  </style>
</head>
<body>
<div class="m-container">
<div class="m-row">
  <div class="m-col-t-12">
    <h1>Magnum Multi-Draw Example</h1>
    <div class="mn-container">
      <div class="mn-sizer"><div class="mn-expander"><div class="mn-listener">
        <canvas class="mn-canvas" id="canvas" tabindex="0"></canvas>
        <div class="mn-status" id="status">Initialization...</div>
        <div class="mn-status-description" id="status-description"></div>
        <div id="overlay"></div>
        <script src="EmscriptenApplication.js"></script>
        <script>
        Module.keyboardListeningElement = Module.canvas;
        Module.canvas.addEventListener('mousedown', function(event) {
          event.target.focus();
        });
        </script>
        <script async="async" src="magnum-multidraw.js"></script>
      </div></div></div>
    </div>
  </div>
</div>
<div class="m-row">
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-default m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [0])">
      SceneGraph
    </a></div>
  </div>
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-default m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [1])">Direct loop</a></div>
  </div>
</div>
<div class="m-row">
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-info m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [2])">Improved loop</a></div>
  </div>
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-info m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [3])">Improved loop + views</a></div>
  </div>
</div>
<div class="m-row">
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-danger m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [4])">Loop + UBOs for each</a></div>
  </div>
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-warning m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [5])">Loop + one UBO + draw offset</a></div>
  </div>
</div>
<div class="m-row">
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-warning m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [6])">Loop + UBOs + offset + views</a></div>
  </div>
  <div class="m-col-m-4 m-push-m-2">
    <div class="m-button m-success m-fullwidth"><a href="javascript:Module.ccall('setDrawType', null, ['number'], [7])">UBOs + multidraw</a></div>
  </div>
</div>
</div>
</body>
</html>
